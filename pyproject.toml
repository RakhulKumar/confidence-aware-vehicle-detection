[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confdet"
version = "0.3.0"
description = "Confidence-aware vehicle detection: calibration and UQ for occlusion-driven missed detections"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

# Every script under scripts/ inserts src/ onto sys.path directly, so
# `pip install -e .` is optional, not required, for running the pipeline --
# it exists for convenience (lets you `import confdet` from anywhere, e.g.
# a notebook, without the sys.path.insert boilerplate every script uses) and
# so this can be pip-installed as a normal dependency if the eventual paper
# repo gets split into a library + experiments structure later.
